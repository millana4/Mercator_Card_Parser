services:
  parsing-service:
    build: .
    init: true
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      # Профили не заданы: у HTTP-сервиса обе сессии (обход и выдача) на временных
      # профилях (после капчи - чистые). Постоянные профили - только у воркера.
    volumes:
      - ./app/debug:/app/app/debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build: .
    init: true
    command: ["python", "-m", "app.worker.run_worker"]
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
      # Постоянные профили: сессия обхода (карточки) и сессия выдачи (поиск, подбор).
      - OZON_CHROME_PROFILE_DIR=/app/chrome-profile
      - OZON_SEARCH_PROFILE_DIR=/app/chrome-profile-search
      # Подбор: свои браузеры выдачи и карточек со своими профилями (после капчи очищаются).
      - OZON_SELECT_LISTING_PROFILE_DIR=/app/chrome-profile-select-listing
      - OZON_SELECT_CARDS_PROFILE_DIR=/app/chrome-profile-select-cards
    volumes:
      - ./app/debug:/app/app/debug
      - ./app/chrome-profile:/app/chrome-profile
      - ./app/chrome-profile-search:/app/chrome-profile-search
      - ./app/chrome-profile-select-listing:/app/chrome-profile-select-listing
      - ./app/chrome-profile-select-cards:/app/chrome-profile-select-cards
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped