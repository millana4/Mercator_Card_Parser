<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Chrome принимает подставленный шрифт, только если имя семейства совпадает
       с запрошенным или пара есть в его списке метрических аналогов
       (Segoe UI/Selawik там нет). Поэтому метрические замены переименовываются
       при сканировании: браузер видит их под именами шрифтов Windows. -->
  <match target="scan">
    <test name="family"><string>Selawik</string></test>
    <edit name="family" mode="assign"><string>Segoe UI</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Carlito</string></test>
    <edit name="family" mode="assign"><string>Calibri</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>Caladea</string></test>
    <edit name="family" mode="assign"><string>Cambria</string></edit>
  </match>
</fontconfig>