<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Linux-аналоги шрифтов Windows (Liberation, Arimo/Tinos/Cousine) на Windows
       отсутствуют. Chrome принимает подставленный шрифт, если его имя совпадает
       с первым семейством запроса после правил fontconfig или он метрический аналог
       запрошенного. Без правила запрос «Liberation Serif» получает Times New Roman
       (аналог) — и шрифт выглядит установленным.
       Поэтому запрошенное имя не меняем, а сразу после него дописываем Georgia:
       fontconfig отдаёт Georgia, она не совпадает по имени и не аналог,
       Chrome подмену отвергает — шрифт считается отсутствующим. -->
  <match target="pattern">
    <test name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="append" binding="strong"><string>Georgia</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Liberation Serif</string></test>
    <edit name="family" mode="append" binding="strong"><string>Georgia</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Liberation Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Georgia</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arimo</string></test>
    <edit name="family" mode="append" binding="strong"><string>Georgia</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Tinos</string></test>
    <edit name="family" mode="append" binding="strong"><string>Georgia</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cousine</string></test>
    <edit name="family" mode="append" binding="strong"><string>Georgia</string></edit>
  </match>
</fontconfig>