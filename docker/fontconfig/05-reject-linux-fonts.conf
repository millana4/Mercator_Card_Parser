<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Скрыть Linux-шрифты от браузера. Пакет fonts-liberation — зависимость
       Chrome, удалить его нельзя, поэтому fontconfig просто не отдаёт эти файлы. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>